<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Independent capstone</title>
<style>body{max-width:760px;margin:3rem auto;padding:1rem;background:#FDF6ED;color:#273d2b;font:17px system-ui}textarea{box-sizing:border-box;width:100%;min-height:130px}button{padding:12px;background:#778873;color:white;border:0;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin-top:20px}</style>
<h1>Build → inspect → review</h1><p>Local synthetic capstone. Scripted provider, fixed demo identities and a local outbox. No message or payment is sent.</p>
<form id="form"><label for="input">Input text</label><textarea id="input" required maxlength="1000">Supplier: Studio
Quantity: 2
Unit price: 10.00
Currency: USD</textarea><button>Run workflow</button></form>
<p id="status" role="status"></p><pre id="result"></pre><button id="review" hidden>Confirm this exact draft as the demo reviewer</button>
<script>
let current;const status=document.querySelector('#status'),result=document.querySelector('#result'),button=document.querySelector('#review');
async function request(url,body,token='student-one') {const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();status.textContent='Running';button.hidden=true;try{current=await request('/api/ask/',{input:document.querySelector('#input').value});result.textContent=JSON.stringify(current,null,2);status.textContent=current.status;button.hidden=current.status!=='needs_review'}catch(e){status.textContent=e.message+'; input retained'}};
button.onclick=async()=>{status.textContent='Reviewing exact stored draft';try{
const approved=await request('/api/records/'+current.id+'/approve/',{version:current.version,digest:current.approval_digest},'reviewer-one');result.textContent=JSON.stringify(approved,null,2);status.textContent='Approved in local outbox; no external delivery';button.hidden=true
}catch(e){status.textContent=e.message}};
</script></html>
