services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academy}
      POSTGRES_USER: ${POSTGRES_USER:-academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${ACADEMY_PORT:-8080}:80"
    volumes:
      - static_data:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped
volumes:
  postgres_data:
  static_data:
