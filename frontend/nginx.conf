server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; frame-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /python/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location /sandbox/ {
        add_header Content-Security-Policy "default-src 'none'; script-src $scheme://$http_host/sandbox/ $scheme://$http_host/python/ 'wasm-unsafe-eval'; worker-src blob:; connect-src $scheme://$http_host/python/; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }
    location /static/ { alias /srv/static/; }
    location / { try_files $uri $uri/ /index.html; }
}
